[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisec"
version = "0.1.0"
description = "Background security watcher for people new to AI"
requires-python = ">=3.9"
dependencies = ["psutil", "pystray", "Pillow"]

[tool.setuptools]
packages = ["aisec"]
